spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/localdb
    username: ${db.username}
    password: ${db.password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    root: INFO
    ch.bzz: DEBUG
  file:
    name: app.log
